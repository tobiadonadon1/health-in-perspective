<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/styles.css">
<style>
html,body{margin:0;background:#0c0807;width:1200px;height:630px;overflow:hidden}
.og{position:relative;isolation:isolate;width:1200px;height:630px;overflow:hidden;color:#fff;font-family:var(--font)}
.og .g{position:absolute;inset:0;z-index:-1;background:radial-gradient(34% 62% at 74% 46%,#ff7a2e 0%,#f2541a 22%,#b8320d 42%,#4a1205 64%,transparent 84%)}
.og img{position:absolute;right:120px;bottom:-40px;height:640px;-webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent 90%),linear-gradient(to right,transparent 8%,#000 42%);-webkit-mask-composite:source-in}
.og .t{position:absolute;left:72px;top:150px;width:560px}
.og h1{font-size:76px;font-weight:400;line-height:.98;letter-spacing:-.045em;margin:0}
.og p{margin:24px 0 0;font-size:26px;color:rgb(255 255 255/.82);line-height:1.35}
.og .b{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:12px;font-size:28px;font-weight:500;letter-spacing:-.02em}
.og .b img{position:static;height:38px;width:38px;-webkit-mask-image:none}
.og .price{position:absolute;left:72px;bottom:60px;display:inline-flex;padding:14px 26px;border-radius:999px;background:#fff;color:#141210;font-size:22px;font-weight:500}
</style></head><body><div class="og"><div class="g"></div>
<img src="/img/portrait.webp" alt="">
<div class="b"><img src="/img/xeyo-orb.webp" alt="">Xeyo</div>
<div class="t"><h1>All your health in one place</h1><p>Wearable data, nutrition and blood work, finally easy to read.</p></div>
<span class="price">€5 a month · AI included</span></div></body></html>
