<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutrition UI verification</title><body><div style="padding:30px;font:14px sans-serif"><p>LOCAL UI TEST · Synthetic food only. Nothing is sent to a provider or database.</p><button id="open">Open meal logger</button><div id="saved" role="status"></div></div><div id="modal"></div><script type="module">
import '../src/ui/base.css';import '../src/ui/card.css';import '../src/ui/shell.css';import '../src/ui/nutrition.css';import {createMealLogger} from '../src/meal-logger.js';
const meal={title:'Eggs and toast',items:[{name:'Two eggs',portion:'2 large eggs',calories:144,protein:12.6,carbs:.7,fat:9.5,confidence:'high'},{name:'Toast',portion:'1 slice, 40 g assumed',calories:100,protein:4,carbs:19,fat:1,confidence:'medium'}],assumptions:['Assumed one 40 g slice.'],question:null,not_food:false};
const logger=createMealLogger({heading:t=>`<div class="eyebrow">Nutrition / UI verification</div><h2 id="dialog-title">${t}</h2>`,icon:()=>'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></svg>',getDay:()=>new Date().toISOString().slice(0,10),getCapabilities:()=>({mealAnalysis:true,transcription:false}),showModal:html=>{const modal=document.querySelector('#modal');modal.hidden=false;modal.innerHTML=`<section class="dialog wide" role="dialog"><button class="close icon-btn" aria-label="Close">×</button>${html}</section>`;document.querySelector('.close').onclick=()=>{logger.cancel();modal.hidden=true;};},api:async()=>{await new Promise(r=>setTimeout(r,300));return {meal:structuredClone(meal)}},remove:async ids=>{document.querySelector('#saved').textContent='Removed: '+ids.join(',')},update:async rows=>{document.querySelector('#saved').textContent=JSON.stringify(rows)},save:async rows=>{document.querySelector('#saved').textContent=JSON.stringify(rows);return rows.map((r,i)=>({...r,id:'test-'+i}));}});
document.querySelector('#open').onclick=()=>logger.open();logger.open();
</script></body></html>
