<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paywall preview (local harness)</title>
<style>.harness-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.harness-grid .wide{grid-column:span 2}.ex-rows{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}.ex-rows li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}.ex-rows b{font-weight:300;font-size:22px;color:var(--ink);letter-spacing:-.03em}.ex-report p{margin-top:8px}.pro-host{flex:1;display:flex;flex-direction:column;border-radius:14px}.frame .chat-window.chat-demo{position:relative;inset:auto;width:min(440px,100%);height:640px;margin-left:auto;animation:none}@media(max-width:900px){.harness-grid{grid-template-columns:minmax(0,1fr)}.harness-grid .wide{grid-column:auto}}</style></head>
<body><div id="app"></div><div id="modal" hidden></div>
<script type="module">
// LOCAL UI HARNESS for src/pro/gate.js. Query: state=cards|dialog|quota|unlocked  seats=3|0  feature=correlations  pro=1
import '../../src/ui/base.css';import '../../src/ui/card.css';import '../../src/ui/shell.css';import '../../src/ui/dialogs.css';import '../../src/ui/chat.css';import '../../src/ui/pro.css';
import {proGate,upgradeDialog,quotaNote,lockedFrom} from '../../src/pro/gate.js';
import {brandOrb} from '../../src/brand.js';
const q=new URLSearchParams(location.search),state=q.get('state')||'cards',locked=state!=='unlocked',left=Number(q.get('seats')??3);
const seats={cap:10,taken:10-left,left,mine:false};
const rows=items=>`<ul class="ex-rows">${items.map(([a,b])=>`<li><span>${a}</span><b>${b}</b></li>`).join('')}</ul>`;
const line='<svg viewBox="0 0 300 90" preserveAspectRatio="none" style="width:100%;height:150px;display:block"><polyline points="0,60 20,52 40,58 60,40 80,46 100,30 120,38 140,26 160,34 180,22 200,30 220,18 240,26 260,14 280,20 300,12" fill="none" stroke="#f5f5f3" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
const card=(cls,title,body)=>`<section class="card ${cls}"><div class="card-head"><span class="marker" aria-hidden="true"></span><h2>${title}</h2></div><div class="pro-host">${body}</div></section>`;
const app=document.querySelector('#app');
const top=`<header class="topbar"><span class="brand">${brandOrb()}<span>Xeyo</span></span></header><div class="page-head"><div><h1>Insights</h1><p>Locked Pro cards show an example, never your data.</p></div></div>`;
const cards=`<div class="harness-grid">${card('wide','Correlations',proGate({feature:'correlations',locked,preview:rows([['Workout after 20:00 → next-morning HRV','−8 ms'],['Under 6 h sleep → recovery','−14 %'],['Alcohol logged → resting heart rate','+4 bpm'],['10k steps → deep sleep','+11 min']])}))}${card('dark','Last 12 months',proGate({feature:'full_history',locked,preview:line+'<p style="margin-top:8px">HRV, monthly average</p>'}))}${card('','Weekly Health Report',proGate({feature:'weekly_report',locked,preview:'<div class="ex-report"><h3>Week of 26 October</h3><p>Recovery averaged 64%, up from 58%. The two nights after late workouts were the lowest of the week.</p><p>Sleep was steadier: six of seven nights within 30 minutes of your usual bedtime.</p></div>'}))}${card('','CSV export',proGate({feature:'csv_export',locked,compact:true,preview:rows([['heart_rate_variability','2,184 rows'],['sleep_duration','366 rows'],['recovery','366 rows']])}))}${card('','Live WHOOP sync',proGate({feature:'whoop_live',locked,compact:true,note:left?`${left} of 10 live seats left`:'Pro WHOOP seats are full',preview:rows([['Last sync','Today 07:12'],['Recovery','71 %']])}))}</div>`;
if(state==='quota'){
 const err=Object.assign(Error('quota'),{code:'quota',feature:'ask_unlimited',used:3,quota:3});
 app.innerHTML=`<main class="frame">${top}<section class="chat-window chat-demo" aria-label="Ask Xeyo"><div class="chat-window-bar"><span>${brandOrb()}Ask Xeyo</span></div><div id="chatbot-host"><div class="convo"><div class="convo-thread"><div class="convo-message user"><small>You</small><div>Why was my recovery low on Tuesday?</div></div><div class="convo-message assistant"><small>Xeyo</small><div>Tuesday followed your shortest night of the week, 5 h 40 min.</div></div><div class="convo-message user"><small>You</small><div>What about the week before?</div></div>${proGate({feature:lockedFrom(err),compact:true,note:quotaNote(err),preview:'<div class="convo-message assistant"><small>Xeyo</small><div>The week before, your recovery averaged higher on the days after you slept over 7 hours, and lower after late workouts.</div></div>'})}</div></div></div></section></main>`;
}else app.innerHTML=`<main class="frame">${top}${cards}</main>`;
if(state==='dialog'){const m=document.querySelector('#modal');m.hidden=false;m.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button class="icon-btn close" data-action="close" aria-label="Close">×</button>${upgradeDialog({feature:q.get('feature')||'correlations',seats,plan:{pro:q.get('pro')==='1'}})}</section>`;m.querySelector('[data-action=checkout]')?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='close'){document.querySelector('#modal').hidden=true}if(b.dataset.action==='upgrade'){const m=document.querySelector('#modal');m.hidden=false;m.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button class="icon-btn close" data-action="close" aria-label="Close">×</button>${upgradeDialog({feature:b.dataset.feature,seats})}</section>`}});
</script></body></html>
