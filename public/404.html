<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="/images/xeyo-orb.png" type="image/png">
<title>Page not found · Xeyo</title>
<script>
// Hosts serve this page for any unknown path. Known Xeyo sections and sign-in paths go to the app;
// everything else stays here.
(function(){
  var slug=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
  var sections={vitals:1,body:1,nutrition:1,journal:1,sleep:1,labs:1,integrations:1,profile:1};
  var auth={login:1,'sign-in':1,signin:1,signup:1,'sign-up':1,register:1,onboarding:1,home:1,reset:1,'forgot-password':1};
  if(sections[slug])location.replace('/#/'+slug);
  // Sign-in paths become a query: redirecting to /login itself would loop on hosts without an app fallback.
  else if(auth[slug])location.replace(slug==='home'?'/':'/?auth='+slug);
})();
</script>
<style>
:root{--ink:#1f2622;--muted:#4d5651;--bg:#f6f5f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:420px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:21px;font-weight:600;letter-spacing:-.04em;margin-bottom:40px}
.brand img{width:32px;height:32px}
.eyebrow{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
h1{margin:0 0 12px;font-size:34px;font-weight:500;letter-spacing:-.04em;line-height:1.1}
p{margin:0 0 28px;font-size:15px;line-height:1.6;color:var(--muted)}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:12px 22px;border-radius:22px;background:var(--ink);color:#fff;text-decoration:none;font-size:14px}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/images/xeyo-orb.png" alt="" width="32" height="32">Xeyo</div>
  <span class="eyebrow">Page not found</span>
  <h1>This page doesn’t exist.</h1>
  <p>The link may be old or mistyped. Your data is safe.</p>
  <a class="btn" href="/">Back to Home</a>
</main>
</body>
</html>
