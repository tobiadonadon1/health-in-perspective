<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="/images/xeyo-orb.png" type="image/png">
<title>Page not found · Xeyo</title>
<script>
// Hosts serve this page for any unknown path. Known Xeyo sections and sign-in paths go to the app;
// everything else stays here.
(function(){
  var slug=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
  var sections={vitals:1,body:1,nutrition:1,journal:1,sleep:1,labs:1,integrations:1,profile:1};
  var auth={login:1,'sign-in':1,signin:1,signup:1,'sign-up':1,register:1,onboarding:1,home:1,reset:1,'forgot-password':1};
  if(sections[slug])location.replace('/#/'+slug);
  // Sign-in paths become a query: redirecting to /login itself would loop on hosts without an app fallback.
  else if(auth[slug])location.replace(slug==='home'?'/':'/?auth='+slug);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&display=swap">
<style>
/* Matches the app's signed-out board: grey canvas, one framed board, the orange portrait card and a white card. */
:root{--canvas:#e9e9e7;--frame:#f4f4f2;--ink:#161616;--ink-2:#55554f;--accent-fill:linear-gradient(135deg,#ff9142 0%,#ff6a1a 55%,#f0520a 100%)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;background:var(--canvas);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.frame{max-width:1440px;min-height:calc(100vh - 48px);margin:0 auto;padding:20px 24px 24px;display:flex;flex-direction:column;border-radius:28px;background:var(--frame)}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;margin-bottom:20px;font-size:16px;font-weight:550;letter-spacing:-.02em}
.brand img{width:30px;height:30px}
.grid{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.art{position:relative;min-height:420px;overflow:hidden;border-radius:20px;background:var(--accent-fill)}
.art img{position:absolute;left:-16%;bottom:-5%;height:108%;filter:grayscale(1) contrast(1.15) brightness(1.05);mix-blend-mode:multiply}
.art b{position:absolute;top:20px;right:20px;padding:24px 28px;border-radius:18px;background:#ffffff1c;box-shadow:inset 0 0 0 1px #ffffff40;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:120px;font-weight:300;letter-spacing:-.06em;line-height:.9}
.card{display:flex;flex-direction:column;justify-content:center;padding:40px;border-radius:20px;background:#fff}
.inner{width:100%;max-width:400px;margin:0 auto}
.head{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:16px}
.head i{width:15px;height:15px;border-radius:4px;background:var(--accent-fill)}
h1{margin:0;font-size:36px;font-weight:400;letter-spacing:-.035em;line-height:1.1}
p{margin:10px 0 26px;font-size:14px;line-height:1.6;color:var(--ink-2)}
a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-size:14px}
a.btn:focus-visible{outline:2px solid #ff6a1a;outline-offset:3px}
@media(max-width:860px){body{padding:0}.frame{min-height:100vh;border-radius:0;padding:14px}.grid{grid-template-columns:1fr}.art{min-height:260px}.art b{font-size:72px;padding:18px 20px}.card{padding:28px 22px}}
</style>
</head>
<body>
<main class="frame">
  <div class="brand"><img src="/images/xeyo-orb.png" alt="" width="30" height="30">Xeyo</div>
  <div class="grid">
    <div class="art" aria-hidden="true"><img src="/images/human-portrait.png" alt=""><b>404</b></div>
    <div class="card"><div class="inner">
      <div class="head"><i></i>Page not found</div>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be old or mistyped. Your data is safe.</p>
      <a class="btn" href="/">Back to Home</a>
    </div></div>
  </div>
</main>
</body>
</html>
